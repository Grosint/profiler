[phases.setup]
nixPkgs = ["python312", "gcc"]

[phases.install]
cmds = [
  "python3 -m venv /opt/venv || python -m venv /opt/venv",
  "/opt/venv/bin/pip install --no-cache-dir --upgrade pip setuptools wheel",
  "/opt/venv/bin/pip install --no-cache-dir cython",
  "/opt/venv/bin/pip install --no-cache-dir -r requirements.txt",
  "/opt/venv/bin/playwright install chromium"
]

[phases.build]
cmds = []

# Note: Start command is defined in Procfile (web: python start.py)
# Railway automatically sets the PORT environment variable
# The start.py script reads PORT from environment: os.getenv("PORT", "8000")
# Railway will route traffic to whatever port your service listens on
# Verify the port in Railway logs: "Starting uvicorn on port {port}..."
